name: CI

# Cross-platform native build + test for config-sync.
#
# Verifies the objective's "Mac, Windows, most Linux, FreeBSD" requirement with
# real native green builds (not just cargo check) on every platform, including
# the liboqs-dependent cs-crypto and cs-keys crates.
#
# liboqs (pqcrypto) needs each platform's native C toolchain (gcc/clang/MSVC +
# CMake), which is why these are full native runners, not cross compiles.
# Tests run with keyring/biometric features OFF so CI never prompts for an OS
# keychain; the live biometric tests are #[ignore].

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  # ---- macOS (aarch64 + x86_64) -----------------------------------------
  macos:
    name: macOS (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-13
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt
      - name: Install CMake
        run: brew install cmake || true
      - name: Build
        run: cargo build --workspace --target ${{ matrix.target }}
      - name: Test (no keyring/biometric — no keychain prompts in CI)
        run: cargo test --workspace --target ${{ matrix.target }} --no-default-features --features cs-storage/local-fs
      - name: Clippy
        run: cargo clippy --workspace --target ${{ matrix.target }} --all-targets -- -D warnings
      - name: fmt
        run: cargo fmt --all -- --check

  # ---- Windows (MSVC, x86_64) -------------------------------------------
  windows:
    name: Windows (MSVC x86_64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install CMake
        run: choco install cmake -y --installargs 'ADD_CMAKE_TO_PATH=System'
      - name: Build
        run: cargo build --workspace --target x86_64-pc-windows-msvc
      - name: Test (no keyring/biometric — no keychain prompts in CI)
        run: cargo test --workspace --target x86_64-pc-windows-msvc --no-default-features --features cs-storage/local-fs

  # ---- Linux (glibc x86_64) ---------------------------------------------
  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
          components: clippy, rustfmt
      - name: Install native build deps (gcc, cmake, dbus for keyring backend)
        run: scripts/install-native-deps.sh
      - name: Build
        run: cargo build --workspace --target x86_64-unknown-linux-gnu
      - name: Test (no keyring/biometric — no Secret Service in CI)
        run: cargo test --workspace --target x86_64-unknown-linux-gnu --no-default-features --features cs-storage/local-fs
      - name: Clippy
        run: cargo clippy --workspace --target x86_64-unknown-linux-gnu --all-targets -- -D warnings
      - name: fmt
        run: cargo fmt --all -- --check

  # ---- Documented install commands (README "Install") --------------------
  # Extracts and executes the `cargo build` command lines documented in the
  # README's Install section (with --locked in the README text), so the README
  # stays the single source of truth: if the documented commands change, this
  # job tests the new commands, and if the block disappears the job fails.
  # Each build runs on exactly the toolchain minimum the README documents for
  # it: 1.85 for the default build, 1.86 for the optional cs-storage backends
  # (the current lockfile's idna/icu crates need 1.86). Stable stays in the
  # other jobs for clippy/fmt.
  install-docs:
    name: README install commands (--locked, at documented minimums)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Install native build deps (same script the README points to)
        run: scripts/install-native-deps.sh
      - name: Default build — the README's non-backend install command(s), on Rust 1.85, with CMake removed
        run: |
          set -euo pipefail
          # The README claims the default build needs no CMake; prove it by
          # removing the package before the documented commands run. The
          # runner image installs CMake under /usr/local, outside dpkg, so
          # remove that copy too.
          sudo apt-get remove -y cmake >/dev/null 2>&1 || true
          sudo rm -f /usr/local/bin/cmake /usr/local/bin/ctest /usr/local/bin/cpack
          if command -v cmake >/dev/null 2>&1; then echo "cmake is still present"; exit 1; fi
          # Commands come from the README's Install section only, and this
          # step must match exactly one non-backend `cargo build` line.
          cmds=$(sed -n '/^## Install$/,/^## /p' README.md | grep -E '^cargo build ' | grep -v -- '--features')
          [ "$(printf '%s\n' "$cmds" | grep -c .)" -eq 1 ] || { echo "expected exactly 1 default cargo build command in the Install section"; exit 1; }
          while IFS= read -r cmd; do
            echo "+ $cmd"
            bash -c "$cmd"
          done <<< "$cmds"
      - uses: dtolnay/rust-toolchain@1.86
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Optional cloud backends build — the README's backend install command(s), on Rust 1.86
        run: |
          set -euo pipefail
          # The backends build needs CMake again (aws-lc-sys); reinstall what
          # the default step removed.
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq cmake >/dev/null
          # Commands come from the README's Install section only, and this
          # step must match exactly one `--features` cargo build line.
          cmds=$(sed -n '/^## Install$/,/^## /p' README.md | grep -E '^cargo build .*--features')
          [ "$(printf '%s\n' "$cmds" | grep -c .)" -eq 1 ] || { echo "expected exactly 1 backends cargo build command in the Install section"; exit 1; }
          while IFS= read -r cmd; do
            echo "+ $cmd"
            bash -c "$cmd"
          done <<< "$cmds"

  # ---- FreeBSD (x86_64) --------------------------------------------------
  # GitHub has no FreeBSD runner; build+test inside a FreeBSD VM.
  freebsd:
    name: FreeBSD (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y rust cmake gmake bash pkgconf gcc
          run: |
            cd "$GITHUB_WORKSPACE" 2>/dev/null || cd /root/work/repo 2>/dev/null || cd /root/work
            pwd
            # Build+test the core (liboqs PQ crypto + sync) without the
            # keyring backend (FreeBSD Secret Service needs a running session).
            cargo build --workspace --no-default-features --features cs-storage/local-fs
            cargo test --workspace --no-default-features --features cs-storage/local-fs
