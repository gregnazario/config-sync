[package]
name = "cs-storage"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["local-fs"]
local-fs = ["dep:fd-lock"]
s3 = ["dep:aws-sdk-s3", "dep:aws-config", "dep:aws-smithy-runtime-api"]
webdav = ["dep:reqwest", "dep:base64"]
gdrive = ["dep:reqwest", "dep:serde", "dep:serde_json"]
proton = ["dep:reqwest", "dep:serde", "dep:serde_json", "dep:base64"]
onedrive = ["dep:reqwest", "dep:serde", "dep:serde_json"]

[dependencies]
async-trait = "0.1"
bytes = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["fs", "io-util", "rt", "macros", "sync"] }
getrandom = "0.3"
hex = "0.4"
aws-sdk-s3 = { version = "1", optional = true }
aws-smithy-runtime-api = { version = "1", optional = true }
aws-config = { version = "1", optional = true }
fd-lock = { version = "4", optional = true }
base64 = { version = "0.22", optional = true }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "multipart",
], optional = true }
serde = { workspace = true, optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["net", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
