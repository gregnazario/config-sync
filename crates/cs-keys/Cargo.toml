[package]
name = "cs-keys"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sha2 = "0.10"
hex = "0.4"
thiserror = { workspace = true }
cs-crypto = { path = "../cs-crypto" }
base64 = "0.22"
serde = { workspace = true }
postcard = { version = "1", features = ["alloc"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
bip39 = { version = "2", features = ["rand"] }
sharks = "0.5"
getrandom = "0.3"
zeroize = { workspace = true }

[features]
default = []
# Enable OS keychain-backed storage. Selecting this feature automatically pulls
# the correct native backend for the compile target:
#   macOS          -> apple-native (Keychain)
#   Windows        -> windows-native (Credential Manager / NGC)
#   Linux          -> linux-native-sync-persistent (linux-keyutils + Secret Service)
#   FreeBSD/OpenBSD-> sync-secret-service (Secret Service via D-Bus)
keyring = ["dep:keyring"]
# Enable biometric-gated storage (Touch ID / Face ID + device passcode on
# macOS; Windows Hello on Windows; falls back to the regular keyring store on
# Linux/FreeBSD).
biometric = ["keyring", "dep:security-framework", "dep:zbus"]

# --- keyring core ---------------------------------------------------------
[dependencies.keyring]
version = "3"
optional = true
default-features = false

# --- per-target native backends ------------------------------------------
# Each target only activates its own backend; the others are no-ops there.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", optional = true, default-features = false, features = ["apple-native"] }
# security-framework is macOS-only; gating it here stops Windows/Linux from
# trying to compile core-foundation (which needs os::unix).
security-framework = { version = "3", optional = true }

[target.'cfg(target_os = "ios")'.dependencies]
keyring = { version = "3", optional = true, default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", optional = true, default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", optional = true, default-features = false, features = ["linux-native-sync-persistent"] }
zbus = { version = "4", optional = true }

[target.'cfg(any(target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
keyring = { version = "3", optional = true, default-features = false, features = ["sync-secret-service"] }
