[package]
name = "cs-integration-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = []
# When enabled, cs-storage is built with its "s3" feature and the gated
# s3_backend conformance test is compiled. Live tests still need env config.
s3 = ["cs-storage/s3", "dep:aws-sdk-s3"]

[dependencies]
cs-crypto = { path = "../cs-crypto" }
cs-keys = { path = "../cs-keys" }
cs-storage = { path = "../cs-storage" }
cs-config = { path = "../cs-config" }
cs-manifest = { path = "../cs-manifest" }
cs-sync = { path = "../cs-sync" }
cs-ui = { path = "../cs-ui", default-features = false }
tokio = { version = "1", features = ["macros", "rt"] }
bytes = { workspace = true }
tempfile = "3"

[dependencies.aws-sdk-s3]
version = "1"
optional = true
