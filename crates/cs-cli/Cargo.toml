[package]
name = "cs-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sync config files across machines with post-quantum E2E encryption"
repository = "https://github.com/gregnazario/config-sync"
homepage = "https://github.com/gregnazario/config-sync"
readme = "../../README.md"
keywords = ["config", "sync", "encryption", "post-quantum", "backup"]
categories = ["command-line-utilities", "cryptography"]

[[bin]]
name = "config-sync"
path = "src/main.rs"

[features]
default = ["keyring-store", "biometric", "terminal"]
# Use the OS keychain for device identity. Off in tests so they use an
# in-process file-backed secret store.
keyring-store = ["cs-keys/keyring"]
# Gate the device identity behind biometrics (Touch ID / Face ID + device
# passcode on macOS; falls back to the plain keyring store elsewhere).
biometric = ["cs-keys/biometric", "keyring-store"]
# Interactive terminal conflict resolver (dialoguer/console). Off in tests.
terminal = ["cs-ui/terminal"]

[dependencies]
cs-crypto = { path = "../cs-crypto" }
cs-keys = { path = "../cs-keys" }
cs-config = { path = "../cs-config" }
cs-manifest = { path = "../cs-manifest" }
cs-sync = { path = "../cs-sync" }
cs-storage = { path = "../cs-storage", features = ["local-fs"] }
cs-ui = { path = "../cs-ui" }
clap = { version = "4", features = ["derive"] }
thiserror = { workspace = true }
serde = { workspace = true }
toml = "0.8"
dirs = "5"
postcard = { version = "1", features = ["alloc"] }
getrandom = "0.3"
hex = "0.4"
tokio = { version = "1", features = ["rt", "macros", "fs"] }

[dev-dependencies]
tempfile = "3"

# ---- cargo-binstall: prebuilt binary download ----
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/config-sync-{ target }-{ version }.tar.gz"
bin-dir = "config-sync-{ target }-{ version }/config-sync{ binary-ext }"
pkg-fmt = "tgz"

# ---- cargo-deb: Debian/Ubuntu .deb package ----
[package.metadata.deb]
maintainer = "Greg Nazario <greg@gregnazario.com>"
depends = "libdbus-1-3"
section = "utils"
priority = "optional"
assets = [
    ["target/release/config-sync", "usr/bin/", "755"],
]

# ---- cargo-generate-rpm: Fedora/RHEL .rpm package ----
[package.metadata.generate-rpm]
release = "1"
assets = [
    { source = "target/release/config-sync", dest = "/usr/bin/config-sync", mode = "755" },
]
[package.metadata.generate-rpm.requires]
dbus-libs = "*"
tokio = { version = "1", features = ["macros", "rt"] }
