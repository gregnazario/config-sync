# Flatpak manifest for config-sync
# Build: flatpak-builder build-dir io.github.gregnazario.config-sync.yml
# Run:   flatpak run io.github.gregnazario.config-sync
# Note: Flatpak is primarily for GUI apps; a CLI tool works but is invoked
# via `flatpak run` rather than directly on PATH.

app-id: io.github.gregnazario.config-sync
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: config-sync

# config-sync needs filesystem access (reads/writes dotfiles) and network
# (syncs to cloud storage backends).
finish-args:
  - --share=network
  - --filesystem=home
  - --filesystem=/etc
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.kwalletd5
  - --talk-name=org.freedesktop.systemd1

modules:
  - name: config-sync
    buildsystem: simple
    build-commands:
      - install -Dm755 config-sync ${FLATPAK_DEST}/bin/config-sync
    sources:
      - type: archive
        url: https://github.com/gregnazario/config-sync/releases/download/v0.1.0/config-sync-x86_64-unknown-linux-gnu-v0.1.0.tar.gz
        sha256: PLACEHOLDER_SHA256
        strip-components: 0
