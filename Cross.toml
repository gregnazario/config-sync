# cross configuration: add libdbus + libclang dev headers to the Linux image so
# the `keyring` Linux backend (Secret Service via D-Bus) can build, and CMake
# is present for liboqs.
[target.x86_64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture $CROSS_DEB_ARCH",
    "apt-get update && apt-get --assume-yes install cmake libdbus-1-dev libclang-dev pkg-config",
]

[target.aarch64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture $CROSS_DEB_ARCH",
    "apt-get update && apt-get --assume-yes install cmake libdbus-1-dev libclang-dev pkg-config",
]
