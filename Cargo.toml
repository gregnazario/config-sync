[workspace]
resolver = "2"
members = [
    "crates/cs-crypto",
    "crates/cs-keys",
    "crates/cs-storage",
    "crates/cs-config",
    "crates/cs-integration-tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.75"

[workspace.dependencies]
thiserror = "1"
zeroize = { version = "1", features = ["zeroize_derive"] }
serde = { version = "1", features = ["derive"] }
bytes = "1"
proptest = "1"
